name: Post-Market Analysis & Improvements

on:
  schedule:
    # Primary: 4:15 PM ET Mon-Fri (20:15 UTC) — 15 min after market close.
    - cron: "15 20 * * 1-5"
    # Catch-up: 7:40 PM ET (23:40 UTC). GitHub's scheduled crons are best-effort
    # and routinely fire 1–2h late or get dropped entirely, so the primary often
    # doesn't land (or fails on runner allocation). This backstop re-attempts the
    # run. It's a no-op when the primary already produced today's report — the
    # script skips if reports/<date>.md exists (idempotency guard in run()).
    - cron: "40 23 * * 1-5"
  workflow_dispatch:

# Never run the primary and catch-up at once; if the primary is still finishing
# (late), the catch-up QUEUES behind it rather than cancelling it — then sees the
# report already exists and no-ops. cancel-in-progress: false is deliberate.
concurrency:
  group: post-market
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv pyflakes; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Run post-market analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python post_market_analysis.py

      - name: Commit report and any code improvements
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"
          git add reports/ lessons_learned.md benchmark_state.json logs/ market_monitor.py wheel_strategy.py copy_trader.py
          git add trades_ledger.jsonl performance.json capital_weights.json risk_state.json 2>/dev/null || true
          # archive_logs.rotate() (called by post_market_analysis.py) truncates any
          # root-level *.log over 512KB in place. That truncation is a real change
          # to a tracked file — if left unstaged, `git pull --rebase` refuses with
          # "unstaged changes" and the report commit above can never sync (this
          # silently ate 3 days of reports once trend_basket.log crossed 512KB).
          git add -f ./*.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: post-market report + improvements $(date +%Y-%m-%d) [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
