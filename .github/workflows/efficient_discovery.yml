name: Efficient Strategy Discovery — Weekly Parameter Tuning

on:
  schedule:
    # Mondays 4 AM UTC — run after agent_loop (which doesn't do anything anymore
    # but may be useful later), new strategy discovery via parameter grid on proven
    # families using research/bt_lib.py + Yahoo cache. Zero Claude API cost.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  efficient-discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv pyflakes; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Fetch latest Yahoo data
        run: python research/fetch_yahoo_cache.py

      - name: Run efficient strategy discovery
        run: python efficient_strategy_discovery.py

      - name: Run deployment guide
        run: python strategy_deployment_guide.py

      - name: Verify all bots still compile
        run: |
          n=0
          for f in *.py; do
            python -m py_compile "$f" || { echo "COMPILE FAILED: $f"; n=$((n+1)); }
          done
          [ "$n" -eq 0 ] || { echo "$n file(s) failed to compile — aborting commit"; exit 1; }

      - name: Commit findings
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"
          git add -f "reports/efficient_discovery_"*.md 2>/dev/null || true
          git add -f "reports/deployment_guide_"*.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Efficient discovery: parameter tuning report $(date -u +%Y-%m-%d) [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
