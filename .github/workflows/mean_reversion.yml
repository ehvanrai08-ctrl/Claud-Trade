name: Mean Reversion (RSI + Bollinger)

on:
  schedule:
    # Once daily ~30 min after open, Mon-Fri (14:00 UTC = 10:00 AM ET)
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

jobs:
  mean-reversion:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install requests python-dotenv

      - name: Write .env
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Run mean reversion
        run: python mean_reversion.py

      - name: Commit state
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"
          git add mean_reversion_state.json 2>/dev/null || true
          git add -f mean_reversion.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update mean reversion state [skip ci]"
          git pull --rebase origin claude/charming-edison-b7imkj || true
          git push origin claude/charming-edison-b7imkj || true
