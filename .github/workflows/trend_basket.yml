name: Trend Basket (high-beta trailing stops)

on:
  schedule:
    # Self-looping job started at market open (13:30 UTC = 9:30 AM ET) with a
    # 2 PM ET (18:00 UTC) handoff relaunch — same pattern as the TSLA monitor.
    - cron: "30 13 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trend-basket
  cancel-in-progress: true

jobs:
  basket:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv tzdata; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Configure git
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"

      - name: Run trend basket (self-looping)
        run: python trend_basket.py

      - name: Commit state
        if: always()
        run: |
          git add trend_basket_state.json
          git add -f trend_basket.log 2>/dev/null || true
          git add trades_ledger.jsonl performance.json capital_weights.json risk_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update trend basket state [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
