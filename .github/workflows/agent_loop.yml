name: Agent Loop — Discovery & Backtest

on:
  # Weekly: every Monday at 3 AM UTC (Sunday 10 PM ET)
  schedule:
    - cron: "0 3 * * 1"
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  agent_loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q requests python-dotenv anthropic pyflakes

      - name: Configure environment
        env:
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > .env <<EOF
          ALPACA_BASE_URL=$ALPACA_BASE_URL
          ALPACA_API_KEY=$ALPACA_API_KEY
          ALPACA_SECRET_KEY=$ALPACA_SECRET_KEY
          EOF

      - name: Run agent loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent_loop.py --limit-candidates 5

      - name: Commit & push report
        run: |
          git config user.name "Claude Agent"
          git config user.email "claude@anthropic.com"
          git add reports/agent_loop_*.md .agent_loop_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Agent loop report [skip ci]"
            git push -u origin claude/charming-edison-b7imkj
          fi
