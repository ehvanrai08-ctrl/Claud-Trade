name: Wheel Strategy (TSLA)

on:
  schedule:
    # Every 15 minutes Mon-Fri strictly within market hours (13:30-19:45 UTC = 9:30 AM-3:45 PM ET)
    - cron: "30,45 13 * * 1-5"
    - cron: "0,15,30,45 14-19 * * 1-5"
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv tzdata; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Run wheel strategy
        run: python wheel_strategy.py

      - name: Commit state
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"
          git add wheel_state.json 2>/dev/null || true
          git add -f wheel.log 2>/dev/null || true
          git add trades_ledger.jsonl performance.json capital_weights.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update wheel state [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
