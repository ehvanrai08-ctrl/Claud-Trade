name: TSLA Market Monitor

on:
  schedule:
    # Start a self-looping job at market open (13:30 UTC = 9:30 AM ET)
    - cron: "30 13 * * 1-5"
    # Handoff/relaunch at 2 PM ET (18:00 UTC) to cover the close past the
    # runtime cap, and to self-heal if the morning job died.
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

# Only one monitor loop at a time. A new trigger cancels the running loop and
# takes over cleanly (state is pushed on every meaningful change, so nothing
# critical is lost on handoff).
concurrency:
  group: market-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # below GitHub's 6-hour hard limit; loop self-caps at 330
    permissions:
      contents: write  # needed to commit state back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          n=0; until pip install requests python-dotenv tzdata; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Configure git (for in-loop state pushes)
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"

      - name: Run market monitor (self-looping)
        run: python market_monitor.py

      - name: Commit final strategy state
        if: always()   # also runs if the loop exits at the runtime cap
        run: |
          git add strategy_state.json
          git add -f monitor.log 2>/dev/null || true
          git add trades_ledger.jsonl performance.json capital_weights.json risk_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update strategy state [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
