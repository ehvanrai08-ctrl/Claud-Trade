name: TJR Strategy (SPY/QQQ Day Trade)

on:
  # PAUSED 2026-06-26. backtest_tjr.py (622 days SPY/QQQ, in/out-of-sample split)
  # shows no edge in any of 8 variants — simple vs full stack, long-only vs
  # long+short, fixed vs trail+BE all post PF<1.1 with negative risk-adjusted
  # returns. Same verdict that paused ORB/SIP-ORB. The live bot had taken ZERO
  # trades anyway (8 stacked confluence gates strangle it). Code kept; to revive,
  # uncomment the cron below. Manual runs still work via workflow_dispatch.
  # schedule:
  #   # One self-looping job starting at 9:30 AM ET (13:30 UTC) — polls the whole
  #   # NY killzone (9:30–11:00 AM ET) internally.
  #   - cron: "30 13 * * 1-5"
  workflow_dispatch:

# Only one killzone loop at a time; a new trigger takes over cleanly.
concurrency:
  group: tjr-strategy
  cancel-in-progress: true

jobs:
  tjr:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # killzone is 90 min; loop self-caps at 110
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv tzdata; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Run TJR strategy (self-looping)
        run: python tjr_strategy.py

      - name: Commit state and log
        if: always()   # commit even if the loop hit its runtime cap
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"
          git add tjr_state.json && git add -f tjr.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update TJR state + log [skip ci]"
          git push origin claude/charming-edison-b7imkj || true
