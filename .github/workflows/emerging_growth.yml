name: Emerging-Growth Basket (experimental)

on:
  schedule:
    # First five days of each month at 10:55 AM ET (14:55 UTC in summer). Offset
    # from the other monthly rotations to avoid runner contention. Once-per-month
    # state guard makes only the first successful run rebalance.
    - cron: "55 14 1-5 * *"
  workflow_dispatch:

jobs:
  rebalance:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Run emerging-growth basket
        run: python emerging_growth.py

      - name: Commit state
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"
          git add emerging_growth_state.json
          git add -f emerging_growth.log 2>/dev/null || true
          git add trades_ledger.jsonl performance.json capital_weights.json risk_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: emerging-growth rebalance $(date +%Y-%m) [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
