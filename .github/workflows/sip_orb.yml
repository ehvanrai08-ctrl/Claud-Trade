name: Stocks-in-Play ORB

on:
  # PAUSED 2026-06-24: tuning sweep showed no config reaches PF>1 unleveraged
  # (top-10 PF 0.52; most-selective top-1 only PF 0.70). The paper's Sharpe 2.81
  # needs 4x leverage + a 1000+ stock universe to isolate true catalysts.
  # Cron disabled — re-enable by uncommenting below. Manual runs still allowed.
  # schedule:
  #   - cron: "35 13 * * 1-5"
  #   - cron: "0 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: sip-orb
  cancel-in-progress: true

jobs:
  sip_orb:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: |
          n=0; until pip install requests python-dotenv tzdata; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Configure git
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"

      - name: Run SIP-ORB (self-looping)
        run: python sip_orb.py

      - name: Commit state
        if: always()
        run: |
          git add sip_orb_state.json
          git add -f sip_orb.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update SIP-ORB state [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
