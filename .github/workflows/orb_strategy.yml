name: ORB Strategy (Opening Range Breakout)

on:
  # PAUSED 2026-06-24: backtests showed no edge unleveraged on single-QQQ ORB
  # (every variant PF<1; baseline hold-to-close PF 0.72 was the best). The
  # documented edge needs leverage + a large catalyst universe we can't run.
  # Cron disabled — re-enable by uncommenting below. Manual runs still allowed.
  # schedule:
  #   - cron: "35 13 * * 1-5"
  #   - cron: "0 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: orb-strategy
  cancel-in-progress: true

jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # loop self-caps at 330
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/charming-edison-b7imkj

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          n=0; until pip install requests python-dotenv tzdata; do
            n=$((n+1)); [ "$n" -ge 3 ] && echo "pip install failed after $n attempts" && exit 1
            echo "pip install failed (attempt $n) — retrying in $((n*5))s..."; sleep $((n*5))
          done

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ALPACA_API_KEY=${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL=https://paper-api.alpaca.markets/v2
          EOF

      - name: Configure git (for in-loop state pushes)
        run: |
          git config user.name  "Claud-Trade Bot"
          git config user.email "bot@claud-trade"

      - name: Run ORB strategy (self-looping)
        run: python orb_strategy.py

      - name: Commit final state
        if: always()
        run: |
          git add orb_state.json
          git add -f orb.log 2>/dev/null || true
          git add trades_ledger.jsonl performance.json capital_weights.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update ORB state [skip ci]"
          n=0; until git pull --rebase origin claude/charming-edison-b7imkj && git push origin claude/charming-edison-b7imkj; do
            n=$((n+1)); [ "$n" -ge 4 ] && echo "git sync failed after $n attempts (non-fatal)" && break
            echo "git sync failed (attempt $n) — retrying in $((n*2))s..."; sleep $((n*2))
          done || true
